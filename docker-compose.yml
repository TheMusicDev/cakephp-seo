# Test database for the plugin's own test suite (MariaDB, like production; never sqlite).
# Port 3308 and database `seo_test` so it does not collide with an app's own `dbtest` on 3307.
#   docker compose up -d --wait dbtest && composer test
services:
  dbtest:
    image: mariadb:11.8
    environment:
      MYSQL_DATABASE: seo_test
      MYSQL_USER: seo
      MYSQL_PASSWORD: seo
      MYSQL_ROOT_PASSWORD: seo
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/mysql
